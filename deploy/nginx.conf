# /etc/nginx/sites-available/webhook-test
#
# The platform only delivers to https URLs on public addresses
# (DELIVERY_ALLOW_HTTP=false, DELIVERY_BLOCK_PRIVATE_ADDRESSES=true), so TLS
# is mandatory. Replace hook.example.com with your domain, then:
#
#   sudo ln -s /etc/nginx/sites-available/webhook-test /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d hook.example.com
#
# certbot fills in the ssl_certificate lines and the port 80 -> 443 redirect.

server {
    listen 80;
    listen [::]:80;
    server_name hook.example.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The platform times out after 10 s by default; answer within that.
        proxy_read_timeout 30s;
        # Never buffer or rewrite the body: the signature covers exact bytes.
        proxy_request_buffering off;
        client_max_body_size 1m;
    }
}
